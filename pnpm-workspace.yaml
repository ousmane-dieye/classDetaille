packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false
overrides:
  deepmerge-ts: 8.0.2
  mysql2: 3.24.6
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
minimumReleaseAgeExclude:
  - mysql2@3.24.6
  - nodemailer@10.1.1
