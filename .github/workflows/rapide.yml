name: rapide
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rapide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rapide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @classepulse/api prisma:generate
      - run: pnpm --filter @classepulse/web gen:tokens && git diff --exit-code apps/web/src/theme/tokens.css
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm depcruise
      - run: pnpm audit --audit-level high
      # image gitleaks v8.30.1
      - name: gitleaks
        run: docker run --rm -u "$(id -u):$(id -g)" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --redact --no-banner
